<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Check – movie details and ratings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>Reel Check</h1>
  <p class="sub">Search any movie. See the details and how IMDb, Rotten Tomatoes and Metacritic rate it.</p>

  <form id="f">
    <input id="q" type="search" placeholder="Try Inception, Dangal, Parasite…" aria-label="Movie name" required>
    <button type="submit">Search</button>
  </form>
  <div class="key">
    <label for="k">OMDb API key</label>
    <input id="k" type="password" placeholder="paste key">
    <button type="button" id="savekey">Save</button>
    <span>Free key: <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener">omdbapi.com/apikey.aspx</a></span>
  </div>

  <div id="msg" role="status">Enter a movie name to begin.</div>
  <div id="picks"></div>
  <div id="out"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>
